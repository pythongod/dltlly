<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rap Battle DB</title>
    <script defer data-domain="battledb.xyz" src="https://plausible.jkl.ink/js/script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="stylesheet" href="table_responsive.css">
</head>
<body>
    <div class="container">
        <div id="filters">
            <button class="filter-btn" data-filter="DLTLLY" data-filter-column="Channel">DLTLLY</button>
            <button class="filter-btn" data-filter="DUDL" data-filter-column="Channel">DUDL</button>
            <button class="filter-btn" data-filter="SPOX" data-filter-column="Channel">SPOX</button>
            <button class="filter-btn" data-filter="FOB" data-filter-column="Channel">FOB</button>
            <button class="filter-btn" data-filter="RAM" data-filter-column="Channel">RAM</button>
            <button class="filter-btn" data-filter="🏆">🏆</button>
            <button class="filter-btn" data-filter="On Beat">On Beat</button>
            <button class="filter-btn" data-filter="">Reset</button>
            <button id="dark-mode-toggle" class="filter-btn">Dark Mode</button>
            <!-- <button class="data-source-btn" data-source="google-sheet" onclick="window.location.href='gindex.html'">GSheet Source</button> -->
            <button class="data-source-btn" data-source="google-sheet" onclick="BattleTable.navigate('gindex_v2.html')">Curated events</button>
            <button class="data-source-btn" onclick="BattleTable.navigate('most_viewed.html')">MOST VIEWED</button>
            <!-- Add more filters as needed -->
        </div>
        <span class="select-control"><label for="content-category">Content</label>
        <select id="content-category"><option value="battle">Battles</option><option value="interview">Interviews</option><option value="promo">Promos</option><option value="other">Other</option><option value="all">All videos</option></select></span>
        <span class="select-control"><label for="sort-order">Sort</label>
        <select id="sort-order"><option value="uploaded">Newest upload</option><option value="views-desc">Most views</option><option value="views-asc">Fewest views</option></select></span>
        <input type="text" id="searchBox" placeholder="Search MCs or a matchup, e.g. Mikesh vs Kato" aria-label="Search battles">
        <div class="info-container">
            <div id="last-updated" class="info-text">Last updated: </div>
            <div id="search-results" class="info-text">Search results: 0</div>
        </div>
        <p id="empty-results" hidden>No matches. Try an MC name or clear your filters with Reset.</p>
        <table id="data-table">
            <thead>
                <tr>
                    <th>MC Name #1</th>
                    <th>MC Name #2</th>
                    <th>Event / Ort</th>
                    <th>Type</th>
                    <th>Year</th>
                    <th>League</th>
                    <th id="sort-uploaded">Uploaded</th>
                    <th>URL</th>
                    <th id="sort-views" title="Click to sort by views">Views</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data rows will be inserted here -->
            </tbody>
        </table>
        <footer>
            <div class="container">
                <a href="subpage.html" onclick="BattleTable.navigate('subpage.html'); return false" class="footer-link">More Information</a>
            </div>
        </footer> 
    </div>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="table_helpers.js"></script>
    <script src="script.js"></script>
</body>
</html>
